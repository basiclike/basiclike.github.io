                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;

                right: 0;
                top: 50%;
                transform: translateY(-50%);

                outline: 0;
                background: #006dd7;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;

                animation-direction: normal;
                animation-fill-mode: none;
