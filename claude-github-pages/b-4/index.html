                border: 0;
                margin: 0 0 15px;

                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);

                background: #006dd7;
                width: 100%;
                border: 0;

                font-size: 14px;

                animation-play-state: running;
                animation-name: spinner-border;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
