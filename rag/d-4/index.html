                background: #f2f2f2;

                border: 0;
                margin: 0 0 15px;

                right: 0;
                top: 50%;
                transform: translateY(-50%);

                outline: 0;
                background: #006dd7;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;

                justify-content: center;

                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
