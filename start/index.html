<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BasicLike · 시작 화면 시안</title>
<meta name="theme-color" content="#0a0c14">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 시작 화면 시안. 비율과 배치: 위에 머리줄, 아래에 장면 줄, 왼쪽 43%에 글, 오른쪽에 입자로 그린 그림.
     테마는 강의 사이트(basiclike.github.io)의 세 테마(헥사 hex, 문서 paper, 클로드 claude)이고, 어두운 바탕(dark)은 견주어 보려고 남겼다.
     입자는 그림을 이룰 때와 흩어질 때만 보인다. 배경에 늘 떠다니는 먼지는 없다. 구조는 start-page.md에 있다 */
  :root { --head: 72px; --foot: 68px; --pad: max(5.3vw, calc((100vw - 1510px) / 2)); --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  html[data-theme="hex"] { --bg: #ffffff; --bgrgb: 255,255,255; --fgc: #1d1933; --fg: 29,25,51; --text2: #4b4766; --muted: #8d89a6; --line: #ebe7f5; --accent: #6d4fe0; --glow: 109,79,224;
    --title-font: "Pretendard Variable", "Pretendard", -apple-system, system-ui, "Malgun Gothic", sans-serif; --title-weight: 800; --body-font: "Pretendard Variable", "Pretendard", -apple-system, system-ui, "Malgun Gothic", sans-serif; --radius: 18px;
    --title-bg: linear-gradient(90deg, #1d1933 30%, #5a3fd0); --title2-bg: linear-gradient(90deg, #7bdcff 0%, #b49cff 50%, #ef7bfc 100%); --btn-bg: linear-gradient(90deg, #7bdcff 0%, #b49cff 50%, #ef7bfc 100%); --btn-fg: #1d1933; }
  html[data-theme="paper"] { --bg: #fbfaf6; --bgrgb: 251,250,246; --fgc: #22201c; --fg: 34,32,28; --text2: #55514a; --muted: #8f897f; --line: #e4ded1; --accent: #0f6e5f; --glow: 15,110,95;
    --title-font: "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif; --title-weight: 900; --body-font: "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif; --radius: 6px;
    --title-bg: linear-gradient(#22201c, #22201c); --title2-bg: linear-gradient(#0f6e5f, #0f6e5f); --btn-bg: #0f6e5f; --btn-fg: #ffffff; }
  html[data-theme="claude"] { --bg: #faf9f5; --bgrgb: 250,249,245; --fgc: #141413; --fg: 20,20,19; --text2: #3d3d3a; --muted: #6c6a64; --line: #e6dfd8; --accent: #cc785c; --glow: 204,120,92;
    --title-font: "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif; --title-weight: 400; --body-font: "Pretendard Variable", "Pretendard", -apple-system, system-ui, "Malgun Gothic", sans-serif; --radius: 12px;
    --title-bg: linear-gradient(#141413, #141413); --title2-bg: linear-gradient(#a9583e, #a9583e); --btn-bg: #cc785c; --btn-fg: #ffffff; }
  html[data-theme="dark"] { --bg: #0a0c14; --bgrgb: 10,12,20; --fgc: #f4f6ff; --fg: 255,255,255; --text2: #c5cde6; --muted: #8b93b5; --line: #232a40; --accent: #ff8a5c; --glow: 255,122,69;
    --title-font: "Noto Serif KR", "Nanum Myeongjo", "Batang", Georgia, serif; --title-weight: 400; --body-font: -apple-system, system-ui, "Malgun Gothic", sans-serif; --radius: 999px;
    --title-bg: linear-gradient(#f4f6ff, #f4f6ff); --title2-bg: linear-gradient(#9db8ff, #9db8ff); --btn-bg: rgba(255,255,255,.12); --btn-fg: #ffffff; }
  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  html.auto { scroll-behavior: auto; }
  body { margin: 0; color: var(--fgc); font-family: var(--body-font); }
  a { color: inherit; text-decoration: none; } button { font: inherit; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  /* 글 뒤의 그림을 왼쪽에서 가린다 */
  .arch { position: fixed; z-index: 2; pointer-events: none; opacity: 0; }   /* 06의 또렷한 아키텍처 그림. 자리와 크기는 스크립트가 정한다 */
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(var(--bgrgb),.94) 0%, rgba(var(--bgrgb),.86) 27%, rgba(var(--bgrgb),.5) 40%, rgba(var(--bgrgb),0) 56%); }
  header, footer { position: fixed; left: 0; width: 100%; z-index: 5; padding: 0 var(--pad); background: rgba(var(--bgrgb),.96); }
  header { top: 0; height: var(--head); }
  .mast { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 11px; }
  .brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--btn-bg); box-shadow: 0 0 0 1px rgba(var(--glow),.25); }
  .brand b { font: 700 22px/1 var(--title-font); letter-spacing: -.03em; }
  .brand span { margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .mast-actions { display: inline-flex; align-items: center; gap: 18px; font-size: 13px; white-space: nowrap; }
  /* 시작 화면을 떠나는 칸: 체크하고 바로 옆 단추를 누르면 된다 */
  .leave { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: min(var(--radius), 12px); overflow: hidden; background: rgba(var(--bgrgb),.9); }
  .never { display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-right: 1px solid var(--line); color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
  .never:hover { color: var(--text2); }
  .never input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .never .l-short { display: none; }
  .leave .jump { border: 0; border-radius: 0; }
  .auto { display: inline-flex; align-items: center; gap: 7px; padding: 9px 2px; border: 0; background: transparent; color: var(--text2); }
  .auto .stop, html.auto .auto .go-t { display: none; } html.auto .auto .stop { display: inline; } html.still .auto { display: none; }
  .jump { display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px; border: 1px solid var(--line); border-radius: min(var(--radius), 12px); color: var(--accent); font-weight: 600; }
  .jump:hover { background: rgba(var(--glow),.08); }
  footer { bottom: 0; height: var(--foot); }
  .chapters { display: grid; grid-template-columns: repeat(7, 1fr); height: 100%; }
  .chapters a { position: relative; display: flex; align-items: center; gap: 9px; padding: 0 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .chapters a::before { content: ""; position: absolute; top: -2px; left: 0; height: 3px; width: 0; background: var(--btn-bg); transition: width .3s; }
  .chapters a.on { color: var(--accent); font-weight: 700; } .chapters a.on::before { width: calc(100% - 14px); }
  .chapters a:hover { color: var(--accent); }
  .chapters small { font: 11px var(--mono); }
  main { position: relative; z-index: 2; pointer-events: none; }
  /* 장면의 글: 왼쪽 43%, 머리줄과 장면 줄 사이의 가운데 */
  .copy { position: fixed; left: var(--pad); top: var(--head); bottom: var(--foot); width: min(43%, 640px); z-index: 3; pointer-events: none; }
  .copy > div { position: absolute; left: 0; right: 0; top: 50%; opacity: 0; transform: translateY(calc(-50% + 12px)); transition: opacity .7s, transform .7s; }
  .copy > div.on { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
  .topic { display: flex; align-items: center; gap: 10px; margin: 0 0 clamp(16px, 3vh, 30px); color: var(--accent); font-size: 13px; font-weight: 650; }
  .topic::before { content: ""; width: 25px; height: 2px; background: var(--btn-bg); }
  .topic span { font: 12px var(--mono); color: var(--muted); }
  .copy h2 { margin: 0; font-family: var(--title-font); font-weight: var(--title-weight); font-size: clamp(34px, 4.1vw, 72px); line-height: 1.28; letter-spacing: -.04em; word-break: keep-all;
    background: var(--title-bg); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .copy h2 span { display: block; background: var(--title2-bg); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin: clamp(18px, 3.4vh, 34px) 0 0; max-width: 31em; color: var(--text2); font-size: clamp(14px, 1.1vw, 18px); line-height: 1.85; word-break: keep-all; }
  .go { display: inline-flex; align-items: center; gap: 20px; margin-top: clamp(22px, 4.4vh, 42px); padding: 12px 19px; border-radius: min(var(--radius), 12px); background: var(--btn-bg); color: var(--btn-fg); font-size: 14px; font-weight: 700; }
  .go:hover { filter: brightness(1.06); }
  .foot { position: fixed; left: var(--pad); bottom: calc(var(--foot) + 8px); z-index: 6; font-size: 11px; color: var(--muted); }
  /* 질문 장면: 오른쪽에 입자가 두른 입력 칸과 예시 질문. 시안이라 보내지는 않는다 */
  .ask { position: fixed; inset: 0; z-index: 3; opacity: 0; pointer-events: none; color: var(--fgc); }
  .ask > * { position: absolute; }
  .ask-head { display: none; }
  .ask form { display: flex; align-items: center; gap: 12px; padding: 0 clamp(8px, 1.2vw, 16px) 0 clamp(20px, 2.6vw, 38px); }
  .ask input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fgc); font-family: var(--title-font); font-size: clamp(16px, 1.7vw, 24px); outline: none; }
  .ask input::placeholder { color: rgba(var(--fg),.5); }
  .ask form button { flex: none; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 0; background: transparent; color: #fff; transition: background .15s, box-shadow .15s; }
  .ask form button svg { display: none; width: 42%; height: 42%; }
 
  .ask form button:hover, .ask form button:focus-visible { background: rgba(var(--glow),.12); box-shadow: 0 0 22px rgba(var(--glow),.3); outline: none; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .chips button { padding: 8px 16px; border-radius: min(var(--radius), 999px); border: 1px solid var(--line); background: rgba(var(--bgrgb),.7); color: var(--text2); font-size: 13px; transition: border-color .15s, color .15s; }
  .chips button:hover, .chips button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  .ask-note { margin: 0; font-size: 11px; letter-spacing: .06em; color: var(--muted); text-align: center; }
  @media (max-width: 800px) {
    :root { --head: 58px; --foot: 58px; --pad: clamp(18px, 5vw, 38px); }
    .brand span { display: none; } .mast-actions { gap: 8px; } .auto .go-t, .auto .stop { font-size: 0; } .auto .go-t::first-letter, .auto .stop::first-letter { font-size: 13px; }
    .never { padding: 0 9px; } .never .l-long { display: none; } .never .l-short { display: inline; } .leave .jump { padding: 8px 11px; font-size: 12px; }
    .veil { background: linear-gradient(180deg, rgba(var(--bgrgb),.94) 0%, rgba(var(--bgrgb),.8) 30%, rgba(var(--bgrgb),0) 50%); }
    .copy { width: auto; right: var(--pad); } .copy > div { top: 20px; transform: translateY(12px); } .copy > div.on { transform: none; }
    .copy h2 { font-size: clamp(30px, 7.4vw, 50px); } .lede { margin-top: 12px; font-size: 14px; line-height: 1.7; } .go { margin-top: 14px; padding: 8px 13px; font-size: 12px; }
    .chapters a { flex-direction: column; justify-content: center; gap: 3px; padding: 0; font-size: 11px; white-space: nowrap; } .chapters a.on::before { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<canvas id="arch" class="arch" aria-hidden="true"></canvas>
<header><div class="mast">
  <a class="brand" href="/" data-leave aria-label="BasicLike 강의 홈으로"><i aria-hidden="true"></i><b lang="en">BasicLike</b><span>배움의 뿌리</span></a>
  <div class="mast-actions">
    <button class="auto" id="auto" type="button"><span class="go-t">▶ 자동 재생</span><span class="stop">■ 멈춤</span></button>
    <div class="leave">
      <label class="never"><input type="checkbox" id="never"><span class="l-long">다음부터 보지 않기</span><span class="l-short">다시 안 보기</span></label>
      <a class="jump" id="skipLink" href="/" data-leave>건너뛰고 강의 보기 <b aria-hidden="true">→</b></a>
    </div>
  </div>
</div></header>
<div class="foot" id="foot" hidden></div>
<div class="copy" id="copy"></div>
<div class="ask" id="ask">
  <div class="ask-head" id="askHead"></div>
  <form id="askForm" aria-label="Claude와 함께하기"><input id="askInput" type="text" placeholder="Claude와 함께 전문가로 성장하기" aria-label="Claude와 함께할 일" autocomplete="off"><button type="submit" aria-label="묻기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
  <div class="chips" id="askChips"><button type="button">막힌 문제 같이 풀기</button><button type="button">오늘 배운 것 정리하기</button><button type="button">다음에 배울 것 고르기</button></div>
  <p class="ask-note" id="askNote">시안 · 입력한 내용은 보내지 않습니다</p>
</div>
<main id="main"></main>
<footer><nav class="chapters" id="dots" aria-label="장면 선택"></nav></footer>
<script>
(function () {
  'use strict';

  /* ═════════ 바꿔 쓸 값 ═════════ */
  var CONFIG = {
    particles: 62000, particlesSmall: 24000, particlesMax: 130000,
    items: 130, itemsSmall: 70,             // 흩날리는 자료(쪽)의 수
    books: 36,                              // 책장 하나의 책(네 칸 × 아홉 권)
    // 스크롤: 장면마다 hold 화면만큼 머물고, move 화면만큼 다음 장면으로 간다(화면 높이 단위)
    home: '/',   // 건너뛰거나 마지막에 갈 곳(강의 사이트의 홈)
    hold: 0.3, move: [2.6, 1.6, 1.6, 1.8, 2.6, 1.5], endHold: 0.6,
    // 저절로 넘기기(처음 온 사람에게만): 머무는 초와 넘어가는 초
    autoplay: { hold: [3.5, 0.8, 0.5, 0.5, 6, 2.5], move: [10, 5, 5, 6, 8, 4], seenKey: 'landing-seen', always: true },   // always: 열 때마다 저절로 넘긴다. false면 처음 온 사람에게만
    // 테마마다 바뀌는 입자의 색. colors는 어두운 바탕(dark)의 색이다. solid는 빛을 더하지 않고 덮어 그린다는 표시다(밝은 바탕).
    // 헥사는 잉크, 보라, 하늘 → 연보라 → 분홍. 문서는 먹색과 청록. 클로드는 검정, 테라코타, 회색
    themes: {
      hex: { solid: true, bg: '#ffffff', white: '#1d1933', pale: '#6d4fe0', blue: '#7bdcff', lilac: '#ef7bfc', dim: '#ebe7f5', hot: '#6d4fe0', accent: '#6d4fe0', fruit: '#ef7bfc', leaf1: '#7bdcff', leaf2: '#b49cff', brown: '#4b4766' },
      paper: { solid: true, bg: '#fbfaf6', white: '#22201c', pale: '#0f6e5f', blue: '#8f897f', lilac: '#55514a', dim: '#e4ded1', hot: '#0f6e5f', accent: '#0f6e5f', fruit: '#b8502a', leaf1: '#0f6e5f', leaf2: '#5fa898', brown: '#55514a' },
      claude: { solid: true, bg: '#faf9f5', white: '#141413', pale: '#cc785c', blue: '#6c6a64', lilac: '#a9583e', dim: '#e6dfd8', hot: '#cc785c', accent: '#cc785c', fruit: '#cc785c', leaf1: '#6c6a64', leaf2: '#a09d96', brown: '#3d3d3a' }
    },
    colors: { bg: '#0a0c14', white: '#eef2ff', blue: '#4f7cff', pale: '#9db8ff', lilac: '#c4b5ff', dim: '#7f8fc4', hot: '#7fa2ff', fruit: '#ff8a5c', accent: '#ff8a5c', leaf1: '#2c9b46', leaf2: '#9ad94a', brown: '#b37c4a' },
    scenes: [
      { name: 'LEARNING', ko: '배움', title: '배움이 모여\n지식이 되고,', body: '처음 원리를 접한 날도 있고, 실습 끝에 그 뜻을 이해한 날도 있습니다. 흩날리는 낱장마다 그런 날의 배움이 담겨 있습니다.', sr: '글줄이 있는 쪽들이 고운 입자로 그려져 어두운 화면 가득 흩날린다.' },
      { name: 'KNOWLEDGE', ko: '지식', title: '지식을 쌓는 시간이\n노력이 되고,', body: '어제 적은 기록을 다시 펼쳐 오늘 이해한 내용을 덧붙입니다. 그렇게 채운 책이 한 권씩 늘어납니다.', sr: '책장의 틀이 서고, 흩날리던 쪽이 모여 책이 되어 한 권씩 꽂힌다.' },
      { name: 'EFFORT', ko: '노력', title: '노력은 뿌리를 내려\n기반이 되고,', body: '비슷한 문제를 여러 번 풀어 본 덕분에 낯선 문제를 만나도 어디부터 살펴볼지 알 수 있습니다.', sr: '눈이 뒤로 물러나면, 방금 채운 책장은 뿌리를 따라 늘어선 수많은 책장 가운데 하나다.' },
      { name: 'FOUNDATION', ko: '기반', title: '깊은 기반 위에서\n결실을 맺고,', body: '이제는 예제를 덮고도 무엇부터 시작할지 정하고, 필요한 기능을 하나씩 완성합니다.', sr: '책장마다 가느다란 잔뿌리가 돋고, 책장과 잔뿌리로 덮인 뿌리 전체가 보인다. 뿌리가 모인 자리에서 줄기가 위로 자라기 시작한다.' },
      { name: 'FRUIT', ko: '결실', title: '결실의 열매는\n실력이 되고,', body: '완성한 기능에 새 조건을 더해 봅니다. 어느 부분을 왜 고쳐야 하는지 스스로 판단할 수 있습니다.', sr: '줄기가 수많은 가지로 갈라져 잎이 돋고, 뿌리에서 가지 끝까지 빛이 흐르며, 가지마다 열매가 익어 빛난다.' },
      { name: 'SKILL', ko: '실력', title: '실력은\n전문가의 길로 이어집니다.', body: '배운 원리로 시스템의 구조를 그리고, 쓰는 사람이 원하는 결과를 얻는지 직접 확인합니다.', sr: '나무를 이루던 입자가 흩어졌다가 입체로 쌓인 세 층의 시스템 그림으로 모인다. 아래부터 데이터 층(데이터베이스와 저장소), 서비스 층(서버와 에이전트), 클라이언트 층(화면과 게이트웨이)이고, 층 사이를 세로 선이 잇는다. 서비스 층 옆에 Claude가 떠 있고, Claude로 가는 길만 강조색이다.' },
